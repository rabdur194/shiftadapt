name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          USE_MOCK_LLM: "true"
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short

      - name: Syntax check main modules
        run: |
          export PYTHONPATH=$PWD
          python -c "from src import config, embeddings, shift_detection, knowledge_base, rag_llm, adapt, evaluate, pipeline; print('All modules import OK')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shiftadapt:ci .

      - name: Smoke test container
        run: |
          docker run -d --name shiftadapt_test -e USE_MOCK_LLM=true -p 8501:8501 shiftadapt:ci
          sleep 15
          curl -f http://localhost:8501/ || true
          docker stop shiftadapt_test
